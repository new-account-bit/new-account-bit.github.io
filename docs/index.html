    <style>
      :root {
        --bg: #f6f1e8;
        --panel: rgba(255, 252, 247, 0.84);
        --panel-strong: #fffdf8;
        --text: #1f1c18;
        --muted: #645a4f;
        --line: rgba(31, 28, 24, 0.12);
        --accent: #b55d35;
        --accent-strong: #8e3f1c;
        --shadow: 0 24px 60px rgba(67, 44, 20, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua",
          Palatino, Georgia, serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(181, 93, 53, 0.18), transparent 30%),
          radial-gradient(circle at top right, rgba(87, 124, 102, 0.16), transparent 28%),
          linear-gradient(180deg, #fbf6ef 0%, var(--bg) 100%);
      }

      a {
        color: inherit;
      }

      .page {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 72px;
      }

      .hero,
      .card,
      .footer {
        backdrop-filter: blur(14px);
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .hero {
        border-radius: 28px;
        padding: 32px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent-strong);
        font-size: 0.9rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .hero h1 {
        font-size: clamp(2.4rem, 5vw, 4.4rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
        max-width: 10ch;
      }

      .hero-copy {
        margin-top: 18px;
        max-width: 640px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .section-title {
        margin: 36px 0 16px;
        font-size: 1rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 18px;
      }

      .card {
        border-radius: 24px;
        padding: 24px;
      }

      .card-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .card h2 {
        font-size: clamp(1.5rem, 3vw, 2rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
      }

      .meta {
        color: var(--muted);
        font-size: 0.92rem;
        white-space: nowrap;
      }

      .card p {
        color: var(--muted);
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .button,
      .ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
      }

      .button {
        background: var(--accent);
        color: #fffaf4;
      }

      .ghost {
        border: 1px solid var(--line);
        background: var(--panel-strong);
      }

      .footer {
        margin-top: 28px;
        border-radius: 20px;
        padding: 18px 22px;
        color: var(--muted);
        line-height: 1.6;
      }

      .footer a {
        color: var(--accent-strong);
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 20px, 980px);
          padding-top: 18px;
        }

        .hero,
        .card {
          padding: 22px;
        }

        .card-header {
          display: block;
        }

        .meta {
          display: inline-block;
          margin-top: 8px;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>MSCHOI's projects</h1>
      </section>

      <h2 class="section-title">Projects</h2>

      <section class="grid" aria-label="Project list">
        <article class="card">
          <div class="card-header">
            <h2>과속 카메라 위치 확인 지도</h2>
            <span class="meta">2025.07</span>
          </div>
          <p>
            지역별 파일을 직접 뒤지지 않아도 과속 카메라 위치를 쉽게 확인할 수
            있도록 만든 서비스입니다.
          </p>
          <div class="actions">
            <a class="button" href="https://speedcameramap.mschoi.com">Visit project</a>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <h2>Compare Area</h2>
            <span class="meta">In progress</span>
          </div>
          <p>
            두 면적을 빠르게 비교할 수 있도록 준비 중인 작은 도구입니다. 내용이
            정리되면 이 카드만 직접 수정하면 됩니다.
          </p>
          <div class="actions">
            <span class="ghost">Coming soon</span>
          </div>
        </article>
      </section>

      <footer class="footer">
        GitHub Pages에서 바로 서비스 중입니다. 앞으로는
        <strong>docs/index.html</strong> 파일만 직접 수정하면 됩니다.
      </footer>
    </main>
